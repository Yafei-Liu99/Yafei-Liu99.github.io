  --display:"Noto Serif SC","Songti SC","STSong",serif;

}

  --env:#7cc4b0; --env-soft:#1a2f2a; --soc:#e3c06e; --soc-soft:#30281a; --gov:#8fb0e6; --gov-soft:#1e2a3d;
  --seal:#e58b74; --seal-soft:#35211c; --hi:#2c4a42; --mid:#21302c; --lo:#1a2126; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1140px;margin:0 auto;padding-inline:18px;padding-block:28px 64px;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,4.5vw,40px);margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--fg);padding:5px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--indigo);color:var(--surface)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--surface)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--env);outline-offset:2px}
section{display:flex;flex-direction:column;gap:14px}
.overview{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.overview p{margin:0;max-width:78ch}
.overview h3{margin:6px 0 0;font-size:15px;color:var(--indigo)}
.overview ul{margin:0;padding-left:1.2em}
.draft{font-size:13px;color:var(--seal);background:var(--seal-soft);border-radius:8px;padding:6px 10px;align-self:flex-start}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pillar{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;border:1px solid var(--line);background:var(--surface)}
.pillar h3{margin:0;font-family:var(--display);font-size:20px;display:flex;align-items:baseline;gap:8px}
.pillar h3 small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.cat{border-left:4px solid var(--pc);background:var(--ps);border-radius:0 8px 8px 0;padding:8px 10px;cursor:pointer;text-align:left;font:inherit;color:var(--fg);border-top:0;border-right:0;border-bottom:0;display:flex;flex-direction:column;gap:4px}
.cat:hover{filter:brightness(.98)}
.cat b{font-size:14px}
.cat .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.qbar{display:flex;gap:3px}
.qbar span{font-size:11px;font-family:var(--mono);border-radius:4px;padding:0 4px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.qbar span.on{color:var(--fg);border-color:var(--pc);font-weight:700}
.band{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--indigo);border-radius:0 0 10px 10px;padding:10px 12px;min-width:0}
.qcard b{display:block;font-family:var(--display);font-size:16px}
.qcard span{font-size:12.5px;color:var(--muted)}
.qcard em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--indigo)}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rule{background:var(--surface);border:1px dashed var(--muted);border-radius:10px;padding:10px 12px;font-size:13.5px;min-width:0}
.rule b{display:block;font-size:14px;margin-bottom:2px}
.filters{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 10px;max-width:100%}

.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
details.ind{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pc,var(--line));border-radius:10px}

.code{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:2px}
.names{min-width:0}

.names span{display:block;font-size:12.5px;color:var(--muted)}
.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
.b{font-size:12px;border-radius:999px;padding:1px 8px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.b.t-Outcome{color:var(--env);border-color:var(--env)}
.b.t-Implementation{color:var(--soc);border-color:var(--soc)}
.b.t-Policy{color:var(--gov);border-color:var(--gov)}
.b.pub{background:var(--env-soft);color:var(--env);border-color:transparent}
.body{padding:0 14px 14px 86px;display:flex;flex-direction:column;gap:10px}
.def{font-size:14.5px;max-width:78ch;margin:0}
.def.en{color:var(--muted);font-size:13.5px}
.warn{background:var(--soc-soft);border-radius:8px;padding:8px 10px;font-size:13.5px;margin:0}

dl div{min-width:0}
dt{font-size:12px;color:var(--muted)}
dd{margin:0;overflow-wrap:anywhere}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:16px}
.card .k{font-size:12px;color:var(--muted)}
.card p{margin:0;font-size:14px}
.card.bl{border-color:var(--seal);background:var(--seal-soft)}
.card.bl h3{color:var(--seal)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}

  .badges{grid-column:1 / -1;justify-content:flex-start;max-width:none}
  .body{padding:0 14px 14px}
  .band,.rules{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

nce ESG：谁说了算？\n\n这个框架追问 super intelligence 的“道”：当效率、利润与人的利益冲突时，谁说了算？当系统能力逐步超过监督它的人，谁定目标、谁能叫停、能不能回头就不再是附属问题，而是治理本身。super intelligence 尚未出现，但这些治理能力要在今天的 AI 系统上建立和检验，所以指标测的是公司现有的 AI 系统，作为通往 super intelligence 路上的先行指标。\n\n框架以E/S/G三支柱、十五类别整理问题，用五问标记每项指标：谁定目标、谁能叫停、谁能申诉、谁扛代价、能不能回头。证据规则区分宣称与可核验事实，底线规定哪些伤害不能被其他成绩抵消；暴露表记录AI规模与财务联系，事件表记录发生了什么。v0.3 与一份 17 项指标的 AI 企业 ESG 评价框架逐项对照，补入其覆盖而本框架缺少的 5 项指标（见“对照与参考”）。暂不出总分，因为证据不齐、部分指标没有简单的好坏方向，平均数也可能掩盖严重伤害。这是以美国为起点、未经验证的研究草稿，指标和可比性仍需实证检验。\n\n# Super Intelligence ESG: Who Gets to Decide?\n\nThis framework asks about the “Dao,” or governing values, of super intelligence: when efficiency or profit conflicts with people’s interests, who gets to decide? As systems grow more capable than the people overseeing them, who sets objectives, who can stop the system and whether choices can be reversed stop being side issues and become governance itself. Super intelligence does not exist yet, but the capacity to govern it has to be built and tested on today’s AI systems. The indicators therefore measure companies’ current AI systems as leading indicators on the path to super intelligence.\n\nIt organizes issues into three environmental, social and governance (E/S/G) pillars and fifteen categories. Indicators carry five question tags: who sets objectives, who can stop the system, who can appeal, who bears the costs, and whether decisions or dependencies can be reversed. Evidence rules distinguish claims from verifiable facts. Bottom lines identify conduct that cannot be offset by good performance elsewhere. Separate exposure and event tables record AI activity, financial commitments and what happened.\n\nVersion 0.3 compares the framework item by item with a 17-indicator ESG evaluation framework for AI companies and adds five indicators that it covers and we lacked (see Comparison & references).\n\nWe do not publish an overall score. Evidence is uneven, some indicators have no simple good-or-bad direction, and averaging can hide serious harm. Instead, function mdLite(md, lang){
  // overview.md holds one top-level section per language; pick by whether the heading contains CJK characters.
  const parts = md.split(/\n(?=#\s)/).filter(p => p.trim()); let html = "";
  const cjk = p => /[一-鿿]/.test((p.match(/^#\s*(.*)/) || [, p])[1]);
  const pick = parts.filter(p => lang === "en" ? !cjk(p) : cjk(p));
  (pick.length ? pick : parts).forEach(p => p.split(/\n\n+/).forEach(b => {
    b = b.trim(); if (!b) return;
    if (/^#+\s/.test(b)) html += `<h3>${esc(b.replace(/^#+\s*/,""))}</h3>`;
    else if (/^[-*]\s/m.test(b)) html += "<ul>" + b.split(/\n/).filter(x=>x.trim()).map(x=>`<li>${esc(x.replace(/^[-*]\s*/,"")).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}</li>`).join("") + "</ul>";
    else html += `<p>${esc(b).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}</p>`;
  }));
  return html;
}

    <p class="note">${T("Claude 写代码和文稿，Codex（gpt-6-astra）出设计、编码文献、前后审稿 8 轮。审稿过程中，投票部分的结论翻过几次，每次都是修了真实错误后撤回旧说法；第 8 轮前双方约定了停止规则：只修代码错误和说过头的话，其余记入 v2 待办，然后冻结。",
      "Claude wrote the code and write-up; Codex (gpt-6-astra) proposed the design, coded the literature and reviewed the work in 8 rounds. During review, the voting results changed several times, each time because a real error was fixed and an earlier claim was withdrawn. Before round 8, both agreed a stopping rule: fix only correctness bugs and overclaims, log the rest for v2, then freeze.")}</p>
    ${tbl([T("被撤回的说法","Withdrawn claim"),T("原因","Why")],[
      [T("“培训费再贵老板也会收回控制权”","“Owners reclaim at any retraining cost”"), T("闲置公司换管理层不付钱的 bug","Idle firms switched for free (bug)")],
      [T("“一旦交给 AI 就回不去”","“A point of no return”"), T("改为“恢复得慢”，取决于还剩多少人在练手","Revised to slow recovery that depends on remaining human practice")],
      [T("“分红让人不想管 AI”（成立／反向成立）","“Dividends weaken (or strengthen) support for control”"), T("选民算账方式有误；改为模拟真实经济后看不出影响","Voter approximation errors; no detectable effect once voters simulate the actual economy")]])}
    <p class="note">${T("局限：参数为示意、未用数据校准；智能体按规则行动，不是大语言模型；没有相关性失败、新任务、算力投资；结果是“如果这些机制成立，量级和时机大概如何”，不是预测。",
      "Limits: stylised, uncalibrated parameters; rule-based agents, not language models; no correlated failures, new tasks or compute investment. Results show the size and timing of effects if these mechanisms hold; they are not forecasts.")}</p>
  </section>`;
  v.querySelectorAll("a.jump").forEach(a => a.onclick = () => { Object.assign(st, {cat:"", pillar:"", type:"", role:"", tier:"", q:"", s:a.dataset.code}); go("ind"); });
}
function render(){
  chrome();
  const v = document.getElementById("view");
  if (st.tab==="arch") arch(v);
  else if (st.tab==="ind") ind(v);
  else if (st.tab==="bl") bl(v);
  else if (st.tab==="x") table(v, DATA.exposure, [["code","代码","Code"],["name_cn","名称","Name",r=>T(r.name_cn,r.name_en)],["definition","定义","Definition"],["unit","单位","Unit"],["candidate_source","候选来源","Candidate source"],["note","备注","Note"]], T("暴露与财务联系：用来解释公司在 AI 上的暴露程度，不直接判断好坏。","Exposure and financial links: context for how exposed a company is to AI, not a judgement."));
  else if (st.tab==="ev") table(v, DATA.event_schema, [["field","字段","Field"],["definition","定义","Definition"],["allowed_values","取值","Allowed values"],["note","备注","Note"]], T("事件表：每起 AI 相关事故、执法或诉讼一行，按事件性质连接类别与五问；同一事件不重复计数。","Event table: one row per AI-related incident, enforcement action or lawsuit, linked to categories and questions; never double-counted."));
  else if (st.tab==="ef") table(v, DATA.evidence_fields, [["field","字段","Field"],["definition","定义","Definition"],["allowed_values","取值","Allowed values"],["note","备注","Note"]], T("证据字段：原“真假检验”改为每条观测都要填写的证据规则。","Evidence fields: the former integrity checks, now recorded for every observation."));
  else if (st.tab==="cmp") cmp(v);
  else if (st.tab==="econ") econ(v);
  else mat(v);
}
render();
</script>
